<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DE3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        p {
            color: red;
        }
        .form_input {
            display: flex;
            justify-content: center;
            padding: 30px;
        }
        .btn-success {
            margin-left: 90px;
        }
        input {
            border-radius: 5px;
            border: 0.1px solid gray;
        }
        .form-label {
            font-weight: 700;
        }
        .input_search {
            width: 100%;
            padding: 5px;
            margin: 20px;
            margin-left: 20px;
        }
        .table-bordered {
            margin-left: 20px;
        }
        td,th {
            text-align: center;
        }
    </style>
</head>

<body>





    <!-- form input -->
    <div class="form_input">
        <div style="border: 1px solid black;border-radius: 5px;height: 350px;width: 750px">
            <h1 style="text-align: center;">Quản Lý Sự Kiện</h1>
            <form onsubmit="addContent(event)">
                <input type="text" class="index" name="index" id="" hidden>
                <div style="display: flex;justify-content: space-around;">
                    <div>
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Tên sự kiện:</label><br>
                            <input type="text" name="name"  class="name" id="exampleInputEmail1"
                                aria-describedby="emailHelp">
                            <p class="obligatory_name"></p>
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Địa điểm:</label><br>
                            <input type="text" name="local" class="local" id="exampleInputPassword1">
                            <p class="obligatory_local"></p>
                        </div>
                    </div>
                    <div>
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Ngày tổ chức:</label><br>
                            <input type="date" name="date" class="date" id="exampleInputEmail1"
                                aria-describedby="emailHelp">
                            <p class="obligatory_date"></p>
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Người tổ chức:</label><br>
                            <input type="text" name="Organizer" class="Organizer" id="exampleInputPassword1">
                            <p class="obligatory_Organizer"></p>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-success">Thêm Sự Kiện</button>
            </form>
        </div>
    </div>

    <!-- input search -->
    <input type="text" class="input_search" name="" id="" placeholder="Tìm kiếm theo tên sự kiện...">





    <!-- modal upLoad -->
    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Thay đổi thông tin</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form class="form_edit" onsubmit="updateContent(event)">
                        <input type="text" name="index" class="index" id="" hidden>
                        <div style="display: flex;justify-content: space-around;">
                            <div>
                                <div class="mb-3">
                                    <label for="exampleInputEmail1" class="form-label">Tên sự kiện:</label><br>
                                    <input type="text" name="name" class="name" id="exampleInputEmail1"
                                        aria-describedby="emailHelp">
                                    <p class="obligatory_edit_name"></p>
                                </div>
                                <div class="mb-3">
                                    <label for="exampleInputPassword1" class="form-label">Địa điểm:</label><br>
                                    <input type="text" name="local" class="local" id="exampleInputPassword1">
                                    <p class="obligatory_edit_local"></p>
                                </div>
                            </div>
                            <div>
                                <div class="mb-3">
                                    <label for="exampleInputEmail1" class="form-label">Ngày tổ chức:</label><br>
                                    <input type="date" name="date" class="date" id="exampleInputEmail1"
                                        aria-describedby="emailHelp">
                                    <p class="obligatory_edit_date"></p>
                                </div>
                                <div class="mb-3">
                                    <label for="exampleInputPassword1" class="form-label">Người tổ chức:</label><br>
                                    <input type="text" name="Organizer" class="Organizer" id="exampleInputPassword1">
                                    <p class="obligatory_edit_Organizer"></p>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <!-- render content -->
    <table class="table table-bordered">
        <thead>
            <tr class="table-dark">
                <th scope="col">Tên sự kiện</th>
                <th scope="col">Ngày</th>
                <th scope="col">Địa điểm</th>
                <th scope="col">Người tổ chức</th>
                <th scope="col">Hành động</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>









    <script src="./de3.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>
</body>

</html>
